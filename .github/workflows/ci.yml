name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: rustup toolchain install stable --component rustfmt --profile minimal --no-self-update
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every optional feature gets linted: an `async`-only bug once shipped because the
        # feature was never built in CI.
        features:
          - "--no-default-features"
          - ""
          - "--features async"
          - "--features noodles-bgzf"
          - "--features zstd"
          - "--features libdeflate"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: rustup toolchain install stable --component clippy --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

  build-and-test:
    name: build+test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.89"]
        exclude:
          # The MSRV check on one OS is enough to keep the matrix small.
          - os: macos-latest
            toolchain: "1.89"
          - os: windows-latest
            toolchain: "1.89"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update
      - name: Pin toolchain
        run: rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Build (default features)
        run: cargo build --workspace --all-targets
      - name: Build (no default features)
        run: cargo build --workspace --all-targets --no-default-features
      - name: Test (default)
        run: cargo test --workspace --lib --tests
      - name: Test (async)
        run: cargo test --workspace --lib --tests --features async
      - name: Test (noodles-bgzf)
        run: cargo test --workspace --lib --tests --features noodles-bgzf
      - name: Test (zstd)
        run: cargo test --workspace --lib --tests --features zstd
      - name: Test (all features)
        run: cargo test --workspace --lib --tests --all-features
      - name: Test docs
        run: cargo test --workspace --doc --all-features

  libdeflate:
    name: build+test (libdeflate, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --features libdeflate
      - run: cargo test --workspace --lib --tests --features libdeflate

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (deny warnings, every feature)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --all-features
